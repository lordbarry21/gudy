<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Clean White / Warm Editorial Ivory Tile Background -->
    <linearGradient id="whiteTileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F2EFE9" />
    </linearGradient>

    <linearGradient id="whiteTileBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2DDD5" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#CBC4B6" stop-opacity="0.7" />
    </linearGradient>

    <!-- Thick Ribbon Gradients -->
    <linearGradient id="ribbonLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="40%" stop-color="#EA580C" />
      <stop offset="85%" stop-color="#D97757" />
      <stop offset="100%" stop-color="#B44D2B" />
    </linearGradient>

    <linearGradient id="ribbonRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="35%" stop-color="#E15B1E" />
      <stop offset="75%" stop-color="#D97757" />
      <stop offset="100%" stop-color="#8C2C0B" />
    </linearGradient>

    <radialGradient id="boldNode" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#D97757" />
      <stop offset="100%" stop-color="#7C2D12" />
    </radialGradient>

    <!-- Warm Soft Shadow for White Tile -->
    <filter id="whiteModeDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#8C3518" flood-opacity="0.22" />
    </filter>

    <filter id="glowCenter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Rounded Rectangle: rx=128 -->
  <rect x="64" y="64" width="896" height="896" rx="128" ry="128" 
        fill="url(#whiteTileBg)" 
        stroke="url(#whiteTileBorder)" 
        stroke-width="8" />

  <!-- Infinity Structure: scale=0.76 centered with ~106px margin to tile edge -->
  <g transform="translate(512, 512) scale(0.76) translate(-512, -512)" filter="url(#whiteModeDrop)">
    <!-- Bold Infinity Base Ribbon - Left Loop -->
    <path d="M 512,512 
             C 400,340 210,300 120,400 
             C 30,500 50,660 160,715 
             C 270,770 410,650 512,512" 
          fill="none" 
          stroke="url(#ribbonLeft)" 
          stroke-width="96" 
          stroke-linecap="round" />

    <!-- Bold Infinity Base Ribbon - Right Loop -->
    <path d="M 512,512 
             C 614,374 754,254 864,310 
             C 974,365 994,525 904,625 
             C 814,725 624,684 512,512" 
          fill="none" 
          stroke="url(#ribbonRight)" 
          stroke-width="96" 
          stroke-linecap="round" />

    <!-- Inner Core Gleam -->
    <path d="M 512,512 
             C 400,340 210,300 120,400 
             C 30,500 50,660 160,715 
             C 270,770 410,650 512,512 
             C 614,374 754,254 864,310 
             C 974,365 994,525 904,625 
             C 814,725 624,684 512,512 Z" 
          fill="none" 
          stroke="#FEF3C7" 
          stroke-width="18" 
          stroke-linecap="round" 
          opacity="0.65" />

    <!-- Knowledge Graph Web Lattice Across the Ribbon -->
    <!-- Left loop network rods -->
    <line x1="120" y1="400" x2="230" y2="480" stroke="#FFFBEB" stroke-width="14" opacity="0.95" />
    <line x1="230" y1="480" x2="160" y2="715" stroke="#FFFBEB" stroke-width="14" opacity="0.95" />
    <line x1="230" y1="480" x2="350" y2="440" stroke="#FFFBEB" stroke-width="14" opacity="0.95" />
    <line x1="350" y1="440" x2="430" y2="600" stroke="#FFFBEB" stroke-width="14" opacity="0.95" />
    <line x1="430" y1="600" x2="512" y2="512" stroke="#FFFBEB" stroke-width="16" opacity="0.95" />

    <!-- Right loop network rods -->
    <line x1="864" y1="310" x2="760" y2="420" stroke="#FFFBEB" stroke-width="14" opacity="0.95" />
    <line x1="760" y1="420" x2="904" y2="625" stroke="#FFFBEB" stroke-width="14" opacity="0.95" />
    <line x1="760" y1="420" x2="660" y2="530" stroke="#FFFBEB" stroke-width="14" opacity="0.95" />
    <line x1="660" y1="530" x2="570" y2="430" stroke="#FFFBEB" stroke-width="14" opacity="0.95" />
    <line x1="570" y1="430" x2="512" y2="512" stroke="#FFFBEB" stroke-width="16" opacity="0.95" />

    <!-- Prominent Graph Constellation Nodes -->
    <!-- Left Loop Nodes -->
    <circle cx="120" cy="400" r="36" fill="url(#boldNode)" stroke="#FFFBEB" stroke-width="8" />
    <circle cx="230" cy="480" r="32" fill="url(#boldNode)" stroke="#FFFBEB" stroke-width="7" />
    <circle cx="160" cy="715" r="40" fill="url(#boldNode)" stroke="#FFFBEB" stroke-width="8" />
    <circle cx="350" cy="440" r="28" fill="url(#boldNode)" stroke="#FFFBEB" stroke-width="6" />
    <circle cx="430" cy="600" r="34" fill="url(#boldNode)" stroke="#FFFBEB" stroke-width="7" />

    <!-- Right Loop Nodes -->
    <circle cx="864" cy="310" r="38" fill="url(#boldNode)" stroke="#FFFBEB" stroke-width="8" />
    <circle cx="760" cy="420" r="32" fill="url(#boldNode)" stroke="#FFFBEB" stroke-width="7" />
    <circle cx="904" cy="625" r="42" fill="url(#boldNode)" stroke="#FFFBEB" stroke-width="8" />
    <circle cx="660" cy="530" r="28" fill="url(#boldNode)" stroke="#FFFBEB" stroke-width="6" />
    <circle cx="570" cy="430" r="34" fill="url(#boldNode)" stroke="#FFFBEB" stroke-width="7" />

    <!-- Central Nexus Mastery Node -->
    <circle cx="512" cy="512" r="54" fill="url(#boldNode)" stroke="#FFFBEB" stroke-width="10" />
    <circle cx="512" cy="512" r="26" fill="#FFFFFF" />

    <!-- Distinct Central 4-Point Star -->
    <path d="M 512,410 Q 512,512 410,512 Q 512,512 512,614 Q 512,512 614,512 Q 512,512 512,410 Z" 
          fill="#FFFBEB" 
          filter="url(#glowCenter)" />
  </g>
</svg>